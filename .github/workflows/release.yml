name: release

on:
  push:
    branches: [main]
    paths: [version.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"

      - name: Skip if release exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        if: steps.check.outputs.exists == 'false'
        run: zip -qr "tikita-creator-workflow-${{ steps.v.outputs.version }}.zip" tikita-creator-workflow

      - name: Release notes from CHANGELOG
        if: steps.check.outputs.exists == 'false'
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            /^## / { on = ($2 == v || index($2, v "｜") == 1) ; next }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "見 CHANGELOG.md" > notes.md

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.version }}" \
            "tikita-creator-workflow-${{ steps.v.outputs.version }}.zip" \
            --title "${{ steps.v.outputs.version }}" \
            --notes-file notes.md
